<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="FlowAtlas publication companion map — all events, cached locally." />
<title>FlowAtlas</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="app">
	<aside id="sidebar" hidden aria-label="Map controls">
		<h1>FlowAtlas</h1>
		<section id="controls">
			<label>Colour by <select id="colour-by"></select></label>
			<label>Marker size <input id="size" type="range" min="0.5" max="6" step="0.1" value="1.5" /></label>
			<details><summary>Reference populations and samples</summary><p class="demo-note">Display filters only. Lasso statistics include all cells inside the outline.</p><div id="legend"></div></details>
		</section>
	</aside>
	<main id="map" aria-label="Publication event map" aria-busy="true">
		<canvas id="canvas" aria-label="EmbedSOM map of all publication events"></canvas>
		<p id="data-summary" hidden></p>
	</main>
	<aside id="demo-panel" hidden aria-label="Population exploration"></aside>
</div>
<div id="loading-overlay">
	<div class="loading-card">
		<p id="status" role="status" aria-live="polite" aria-atomic="true">Loading dataset…</p>
		<progress id="download-progress" max="100" aria-label="Publication download progress"></progress>
		<p id="download-detail"></p>
		<button id="retry-load" type="button" hidden>Retry</button>
	</div>
</div>
<script id="computation-record" type="application/json"></script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
