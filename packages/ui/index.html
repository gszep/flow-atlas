<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>flow-atlas</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="app">
	<aside id="sidebar">
		<h1>flow-atlas <small>prototype</small></h1>
		<section id="load">
			<p>Drop the FlowAtlas.jl <code>data/</code> folder here (a <code>.wsp</code> plus its <code>.fcs</code> files), or</p>
			<input id="files" type="file" multiple webkitdirectory />
			<p id="gpu-info" class="muted"></p>
		</section>
		<section id="status" class="muted"></section>
		<section id="controls" hidden>
			<label>Colour by <select id="colour-by"></select></label>
			<label>Marker size <input id="size" type="range" min="0.5" max="6" step="0.1" value="1.5" /></label>
			<div id="legend"></div>
		</section>
	</aside>
	<main id="map"><canvas id="canvas"></canvas><div id="unsupported" hidden></div></main>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
